[project]
name = "metabolomics-platform"
version = "0.1.0"
description = "Metabolomics, lipidomics and stable-isotope tracing analysis platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "plotly>=5.22",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "networkx>=3.2",
    "escher>=1.8.1",
    "cobra>=0.31",
    "fpdf2>=2.7",
    "kaleido==0.2.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
